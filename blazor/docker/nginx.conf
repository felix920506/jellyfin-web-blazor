map $http_accept_encoding $jf_static_suffix {
    default "";
    "~*br" ".br";
    "~*gzip" ".gz";
}

map $jf_static_suffix $jf_content_encoding {
    default "";
    ".br" "br";
    ".gz" "gzip";
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /config.json { add_header Cache-Control "no-cache" always; try_files $uri =404; }

    location ~* ^/_framework/.*\.js$ {
        default_type application/javascript;
        add_header Content-Encoding $jf_content_encoding always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Vary "Accept-Encoding" always;
        try_files $uri$jf_static_suffix $uri =404;
    }

    location ~* ^/_framework/.*\.wasm$ {
        default_type application/wasm;
        add_header Content-Encoding $jf_content_encoding always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Vary "Accept-Encoding" always;
        try_files $uri$jf_static_suffix $uri =404;
    }

    location /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Vary "Accept-Encoding" always;
        gzip_static on;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=86400" always;
        add_header Vary "Accept-Encoding" always;
        gzip_static on;
        try_files $uri $uri/ /index.html;
    }
}
