name: Blazor preview build

# Builds the Blazor WebAssembly port on every push to its branch and publishes something to try:
#   - the static site on GitHub Pages,
#   - a zip of the static site on the rolling "preview" pre-release,
#   - a container image (nginx serving the site on port 8080) on ghcr.io.

on:
  push:
    branches:
      - blazor-port
    paths:
      - 'blazor/**'
      - 'src/**'
      - '.github/workflows/blazor-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blazor-preview
  cancel-in-progress: true

jobs:
  build:
    name: Check and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Restore package caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/jellyfin-web-blazor/nuget
            ~/.cache/jellyfin-web-blazor/vendor
          key: blazor-${{ hashFiles('blazor/Directory.Packages.props', 'blazor/scripts/prepare-assets.sh') }}
          restore-keys: blazor-
      - name: Build and test
        working-directory: blazor
        run: ./dev check
      - name: Release publish
        working-directory: blazor
        run: ./dev publish
      - name: Stamp the build
        run: |
          site=blazor/artifacts/publish/wwwroot
          test -f "$site/index.html"
          # Folders that start with an underscore (_framework) must not be dropped by Pages.
          touch "$site/.nojekyll"
          printf '%s\n' "$GITHUB_SHA" > "$site/version.txt"
          (cd "$site" && zip -qr "$GITHUB_WORKSPACE/jellyfin-web-blazor.zip" .)
      - name: Upload the site for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: blazor/artifacts/publish/wwwroot
      - name: Upload the site as a zip
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-web-blazor
          path: jellyfin-web-blazor.zip
          if-no-files-found: error

  pages:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Update the preview pre-release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the zip
        uses: actions/download-artifact@v4
        with:
          name: jellyfin-web-blazor
      - name: Replace the "preview" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete preview --yes --cleanup-tag || true
          gh release create preview jellyfin-web-blazor.zip \
            --prerelease --target "$GITHUB_SHA" \
            --title "Preview build" \
            --notes "Automatic build of the Blazor WebAssembly port from commit $GITHUB_SHA. Experimental: unzip and serve the folder with any static web server, then enter the address of a Jellyfin server."

  image:
    name: Publish the container image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: blazor/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:preview
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
